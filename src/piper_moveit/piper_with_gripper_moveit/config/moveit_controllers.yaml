# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  update_rate: 500
  controller_names:
    - arm_controller
    - gripper_controller
    - la_piper_arm_controller
    - la_piper_gripper_controller
    - ra_piper_arm_controller
    - ra_piper_gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    action_ns: follow_joint_trajectory
    default: true
  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint7
    action_ns: follow_joint_trajectory
    default: true
  la_piper_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - la_piper_joint1
      - la_piper_joint2
      - la_piper_joint3
      - la_piper_joint4
      - la_piper_joint5
      - la_piper_joint6
    action_ns: follow_joint_trajectory
    default: true
  la_piper_gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - la_piper_joint7
    action_ns: follow_joint_trajectory
    default: true
  ra_piper_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - ra_piper_joint1
      - ra_piper_joint2
      - ra_piper_joint3
      - ra_piper_joint4
      - ra_piper_joint5
      - ra_piper_joint6
    action_ns: follow_joint_trajectory
    default: true
  ra_piper_gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - ra_piper_joint7
    action_ns: follow_joint_trajectory
    default: true